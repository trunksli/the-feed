services:
  - type: web
    name: the-feed
    runtime: node
    # Paid instance: always on, never spins down. The in-app refresh timer
    # below only works because the process stays alive.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # How often the server re-pulls every source feed.
      # 20 min = 3x/hour. Use 15 for 4x/hour, 30 for 2x/hour.
      - key: REFRESH_INTERVAL_MINUTES
        value: "20"
      # Render generates this. Required as ?token=... on POST /api/refresh,
      # so an external cron can trigger a refresh but randoms can't.
      - key: REFRESH_TOKEN
        generateValue: true
