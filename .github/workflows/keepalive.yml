# Keeps the Render free-tier service awake and its feeds fresh.
#
# Render free services sleep after ~15 min idle, and a sleeping process runs no
# timers — so the in-app refresh loop stops. This pings the app on a schedule:
# waking it triggers a fetch on boot, and if a REFRESH_TOKEN secret is present
# we also force an explicit re-pull.
#
# Required repo variable:  FEED_URL       e.g. https://the-feed-xxxx.onrender.com
# Optional repo secret:    REFRESH_TOKEN  (copy from Render -> Environment)
#
# Note: GitHub's scheduled runs are best-effort and are often delayed 5-20 min
# under load. For tighter timing use an external pinger (cron-job.org).

name: Keepalive

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min (GitHub's minimum granularity is 5)
  workflow_dispatch:          # lets you run it manually from the Actions tab

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FEED_URL: ${{ vars.FEED_URL }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
    steps:
      - name: Wake the service
        run: |
          if [ -z "$FEED_URL" ]; then
            echo "::error::Repo variable FEED_URL is not set (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi
          # A cold start can take ~60s, so allow a generous timeout and retries.
          curl --fail --show-error --silent \
               --retry 5 --retry-delay 15 --retry-all-errors \
               --max-time 120 \
               "$FEED_URL/healthz"
          echo

      - name: Force a feed refresh
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "No REFRESH_TOKEN secret set - skipping forced refresh."
            echo "(Waking the service already triggers a fetch on boot.)"
            exit 0
          fi
          curl --fail --show-error --silent \
               --retry 3 --retry-delay 10 --retry-all-errors \
               --max-time 120 \
               -X POST \
               -H "x-refresh-token: $REFRESH_TOKEN" \
               "$FEED_URL/api/refresh" \
            | head -c 300
          echo
