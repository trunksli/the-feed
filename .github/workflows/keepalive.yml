# Keeps the Render free-tier service awake and its feeds fresh.
#
# Render free services sleep after ~15 min idle, and a sleeping process runs no
# timers — so the in-app refresh loop stops. This pings the app on a schedule:
# waking it triggers a fetch on boot, and if a REFRESH_TOKEN secret is present
# we also force an explicit re-pull.
#
# Required repo variable:  FEED_URL       e.g. https://the-feed-xxxx.onrender.com
# Optional repo secret:    REFRESH_TOKEN  (copy from Render -> Environment)
#
# Note: GitHub's scheduled runs are best-effort, not guaranteed. Measured on
# this repo over 3 days, a '*/15' schedule requested 287 runs and GitHub ran
# 40 - an average gap of 108 min and a worst gap of 208 min. Every gap exceeded
# Render's ~15 min sleep threshold. Requesting every 5 min raises the number
# that survive throttling, but do NOT expect 5 min spacing.
#
# For genuinely reliable timing, use an external pinger (cron-job.org,
# UptimeRobot) hitting /healthz. This workflow is the zero-extra-account option.
#
# GitHub also disables scheduled workflows after 60 days of repo inactivity.

name: Keepalive

on:
  schedule:
    # Every 5 min (GitHub's minimum), offset off the :00/:05/:15/:30/:45
    # boundaries where scheduled-workflow contention is worst.
    # To slow this down, keep the +2 offset and drop minutes:
    #   every 10 min -> '2,12,22,32,42,52 * * * *'
    #   every 15 min -> '2,17,32,47 * * * *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:          # lets you run it manually from the Actions tab

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FEED_URL: ${{ vars.FEED_URL }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
    steps:
      - name: Wake the service
        run: |
          if [ -z "$FEED_URL" ]; then
            echo "::error::Repo variable FEED_URL is not set (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi
          # A cold start can take ~60s, so allow a generous timeout and retries.
          curl --fail --show-error --silent \
               --retry 5 --retry-delay 15 --retry-all-errors \
               --max-time 120 \
               "$FEED_URL/healthz"
          echo

      - name: Force a feed refresh
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "No REFRESH_TOKEN secret set - skipping forced refresh."
            echo "(Waking the service already triggers a fetch on boot.)"
            exit 0
          fi
          curl --fail --show-error --silent \
               --retry 3 --retry-delay 10 --retry-all-errors \
               --max-time 120 \
               -X POST \
               -H "x-refresh-token: $REFRESH_TOKEN" \
               "$FEED_URL/api/refresh" \
            | head -c 300
          echo
